  - "https://git.sr.ht/~rjarry/aerc/tree/master/item/doc/aerc.1.scd"
  - "https://man.sr.ht/~rjarry/aerc/"
  - "https://formulae.brew.sh/formula/aerc"
  - "https://sources.debian.org/src/aerc/"
  - "https://packages.fedoraproject.org/pkgs/aerc/aerc/"
