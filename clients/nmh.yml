  - "https://git.savannah.gnu.org/cgit/nmh.git/tree/man/mh-tailor.man"
  - "https://git.savannah.gnu.org/cgit/nmh.git/tree/man/mhical.man"
  - "https://git.savannah.gnu.org/cgit/nmh.git/tree/sbr/credentials.c"
  - "https://packages.debian.org/trixie/nmh"
  - "https://mdapi.fedoraproject.org/rawhide/pkg/nmh"
  - "https://aur.archlinux.org/packages/nmh"
